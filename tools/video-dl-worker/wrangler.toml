name = "video-dl"
main = "src/index.ts"
compatibility_date = "2026-07-01"
workers_dev = false

routes = [
  { pattern = "video-dl.cajuos.dev", custom_domain = true }
]

[vars]
ALLOWED_ORIGIN = "https://cajuos.dev"

[[kv_namespaces]]
binding = "VIDEO_DL_CACHE"
id = "96f97fdb3a984003836924ce5ca238b8"

[[containers]]
class_name = "GalleryContainer"
image = "ghcr.io/schnnjuan/video-dl-gallery:latest"
max_instances = 2
name = "video-dl-gallery"

[[durable_objects.bindings]]
name = "GALLERY_CONTAINER"
class_name = "GalleryContainer"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GalleryContainer"]

[triggers]
crons = []
